slack:
  webhook_env: SLACK_WEBHOOK_URL   # name of the environment variable holding the webhook URL
  # Routine reports (`anomaly-alerts routine`) post here so they stay out of the alert channel.
  # If this variable is unset, routine reports use webhook_env instead.
  routine_webhook_env: SLACK_ROUTINE_WEBHOOK_URL
  cooldown_minutes: 60
  max_alerts_per_run: 10
  # Optional. With one job per cloud, each routine report would arrive once per cloud. Set this
  # in every cloud's config and they fill in ONE message instead: the first job to run posts it,
  # and the others add their section to it. Needs a Slack bot token (scopes chat:write and
  # channels:history, or groups:history for a private channel) in the bot_token_env variable,
  # and the bot added to the channel. Run the jobs a few minutes apart. Without the token, or if
  # Slack refuses, the job posts its own message to the webhook, so a report is never lost.
  # A host whose cron is in UTC only (Azure Container Apps) can run with `--local-hours 0,6,12,18`
  # and be scheduled at every UTC hour that can be one of those. The job then runs only when the
  # hour in time_zone is one of them, so it follows daylight saving.
  # Optional. Post alerts with the bot token instead, so each alert is a thread: a reminder after
  # the cooldown goes in the thread (and updates the top message), an escalation to critical
  # also shows in the channel, and when the metric has been quiet for two runs the top message
  # turns green and says how long it lasted. Without the token, alerts go to the webhook as before.
  # alert_threads:
  #   channel: C0123456789              # channel ID, not the name
  #   bot_token_env: SLACK_BOT_TOKEN
  # shared_message:
  #   cloud: aws                        # this config's cloud: its section in the message
  #   clouds: [aws, azure, gcp]         # every cloud that should report, in the order shown
  #   channel: C0123456789              # channel ID, not the name
  #   bot_token_env: SLACK_BOT_TOKEN
  #   time_zone: America/New_York       # the zone the schedules are written in

state:
  path: .state/alerts.json

# Optional. One routine job can report on every cloud (the metrics and cost accounts below can
# mix clouds). To show each cloud's alert job in the heartbeat, say where each one keeps its
# state. Without this, the heartbeat reads state.path as the one alert job.
# alert_state:
#   aws: s3://my-bucket/state/alerts.json
#   azure: https://myaccount.blob.core.windows.net/app/state/alerts.json
#   gcp: /mnt/app/state/alerts.json

actions_file: actions.yaml         # relative to this file

# Applied to every metric unless the metric overrides it.
# `threshold` is left out on purpose: each detector has its own default
# (mad 3.5, zscore 3.0, ewma 3.0, iqr 1.5). Set it only to override.
# The `threshold` detector is different: it compares to a fixed limit instead of a learned
# baseline, so it alerts from the first point and never learns a bad level as normal. There
# `threshold` is the limit (required) and `direction` must be spike (above) or drop (below).
# Any metric can set `severity: warning` or `severity: critical` to fix its alert's severity.
# `every: 30m` makes the alert job read a metric once per 30 minutes instead of every run, which
# saves money where reads are billed (CloudWatch). With the threshold detector, `within: 2`
# alerts when either of the last two periods breached, so data that arrives late still counts.
# `run_every` (top level, default 5m) says how often the alert job runs.
defaults:
  lookback: 24h
  period: 5m
  detector: mad
  min_points: 30
  sustained_points: 3

# Every metric is fetched on every run, so cost grows with this list. Aim for 10 to 15
# that matter, and prefer one metric split by group_by over many near-identical ones.
metrics:
  - name: alb-5xx
    provider: aws
    region: us-east-1
    namespace: AWS/ApplicationELB
    metric: HTTPCode_Target_5XX_Count
    dimensions: {LoadBalancer: app/prod-api/abc123}
    stat: Sum
    category: errors
    direction: spike
    fill_missing: zero             # CloudWatch omits periods with no errors
    min_abs_change: 5
    runbook: https://wiki.example.com/runbooks/alb-5xx

  - name: vm-cpu
    provider: azure
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/prod/providers/Microsoft.Compute/virtualMachines/web-1
    metric: Percentage CPU
    aggregation: average
    category: cpu
    direction: spike
    min_abs_change: 15

  - name: gce-cpu
    provider: gcp
    project: my-project
    metric_type: compute.googleapis.com/instance/cpu/utilization
    filter: 'resource.labels.instance_id = "1234567890"'
    aligner: ALIGN_MEAN
    category: cpu
    direction: spike
    min_abs_change: 0.15           # GCP reports CPU as a 0 to 1 fraction

  # Org-wide: query the scoping project, whose metrics scope covers every project in
  # the org (terraform/gcp/org), and split by project so each one alerts on its own.
  - name: org-error-logs
    provider: gcp
    project: slack-anomaly-dev
    metric_type: logging.googleapis.com/log_entry_count
    filter: 'metric.labels.severity = "ERROR"'
    aligner: ALIGN_DELTA           # a count per period
    group_by: [resource.labels.project_id]
    category: errors
    direction: spike
    fill_missing: zero             # no error logs in a period means zero
    min_abs_change: 10

  # An audit event that matters every time: any period with one alerts. Audit logs become
  # numbers on each cloud: a CloudWatch Logs metric filter (AWS), a log-based metric (GCP),
  # or, on Azure, a KQL query whose rows are counted per period, as here.
  - name: role-assignments
    provider: azure
    workspace_id: 00000000-0000-0000-0000-000000000000  # the workspace's customer ID, or its full resource ID
    query: AzureActivity | where OperationNameValue =~ "Microsoft.Authorization/roleAssignments/write"
    category: security
    detector: threshold
    threshold: 0
    direction: spike
    sustained_points: 1
    severity: critical

# Optional: spend per account for `anomaly-alerts routine --kind cost`, run once a day.
# Reports the day lag_days ago against the average of the baseline_days before it.
cost:
  lag_days: 1            # billing data arrives late; an account can set its own (see below)
  baseline_days: 7
  alert_pct: 25          # flag a day this far above the average...
  min_abs_change: 1      # ...and at least this much more, in the account's currency
  top_services: 5
  budget_warn_pct: 80    # with a budget: warn at this share spent, or when on pace to pass it
  accounts:
    - name: aws-main
      provider: aws      # Cost Explorer; optional linked_account to filter one member account
      budget: 3          # optional monthly limit in the account's currency; the report shows
                         # month to date against it and warns early. With two or more member
                         # accounts (or GCP projects) it also lists each one's spend.
    - name: azure-prod
      provider: azure
      scope: /subscriptions/00000000-0000-0000-0000-000000000000
    - name: gcp-dev
      provider: gcp      # needs the Cloud Billing export to BigQuery turned on
      billing_table: my-billing-project.billing.gcp_billing_export_v1_XXXXXX
      project: slack-anomaly-dev
      job_project: my-project  # optional: run the query here, needing only read access to the table
      lag_days: 2        # optional: this account's own lag, since the GCP export runs a day behind.
                         # Accounts on different days are reported together, each marked with its day.
