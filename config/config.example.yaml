slack:
  webhook_env: SLACK_WEBHOOK_URL   # name of the environment variable holding the webhook URL
  # Routine reports (`anomaly-alerts routine`) post here so they stay out of the alert channel.
  # If this variable is unset, routine reports use webhook_env instead.
  routine_webhook_env: SLACK_ROUTINE_WEBHOOK_URL
  cooldown_minutes: 60
  max_alerts_per_run: 10

state:
  path: .state/alerts.json

actions_file: actions.yaml         # relative to this file

# Applied to every metric unless the metric overrides it.
# `threshold` is left out on purpose: each detector has its own default
# (mad 3.5, zscore 3.0, ewma 3.0, iqr 1.5). Set it only to override.
defaults:
  lookback: 24h
  period: 5m
  detector: mad
  min_points: 30
  sustained_points: 3

metrics:
  - name: alb-5xx
    provider: aws
    region: us-east-1
    namespace: AWS/ApplicationELB
    metric: HTTPCode_Target_5XX_Count
    dimensions: {LoadBalancer: app/prod-api/abc123}
    stat: Sum
    category: errors
    direction: spike
    fill_missing: zero             # CloudWatch omits periods with no errors
    min_abs_change: 5
    runbook: https://wiki.example.com/runbooks/alb-5xx

  - name: vm-cpu
    provider: azure
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/prod/providers/Microsoft.Compute/virtualMachines/web-1
    metric: Percentage CPU
    aggregation: average
    category: cpu
    direction: spike
    min_abs_change: 15

  - name: gce-cpu
    provider: gcp
    project: my-project
    metric_type: compute.googleapis.com/instance/cpu/utilization
    filter: 'resource.labels.instance_id = "1234567890"'
    aligner: ALIGN_MEAN
    category: cpu
    direction: spike
    min_abs_change: 0.15           # GCP reports CPU as a 0 to 1 fraction

  # Org-wide: query the scoping project, whose metrics scope covers every project in
  # the org (terraform/gcp/org), and split by project so each one alerts on its own.
  - name: org-error-logs
    provider: gcp
    project: slack-anomaly-dev
    metric_type: logging.googleapis.com/log_entry_count
    filter: 'metric.labels.severity = "ERROR"'
    aligner: ALIGN_DELTA           # a count per period
    group_by: [resource.labels.project_id]
    category: errors
    direction: spike
    fill_missing: zero             # no error logs in a period means zero
    min_abs_change: 10

# Optional: spend per account for `anomaly-alerts routine --kind cost`, run once a day.
# Reports the day lag_days ago against the average of the baseline_days before it.
cost:
  lag_days: 1            # billing data arrives late; GCP's export can need 2
  baseline_days: 7
  alert_pct: 25          # flag a day this far above the average...
  min_abs_change: 1      # ...and at least this much more, in the account's currency
  top_services: 5
  accounts:
    - name: aws-main
      provider: aws      # Cost Explorer; optional linked_account to filter one member account
    - name: azure-prod
      provider: azure
      scope: /subscriptions/00000000-0000-0000-0000-000000000000
    - name: gcp-dev
      provider: gcp      # needs the Cloud Billing export to BigQuery turned on
      billing_table: my-billing-project.billing.gcp_billing_export_v1_XXXXXX
      project: slack-anomaly-dev
      job_project: my-project  # optional: run the query here, needing only read access to the table
