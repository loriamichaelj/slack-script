[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-alerts"
version = "0.1.0"
description = "Detect metric anomalies on AWS, Azure and GCP and post rich alerts to Slack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
azure = ["azure-identity>=1.15", "azure-monitor-query>=1.3,<2"]
gcp = ["google-cloud-monitoring>=2.15"]
all = ["anomaly-alerts[aws,azure,gcp]"]
dev = ["pytest>=7"]

[project.scripts]
anomaly-alerts = "anomaly_alerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
