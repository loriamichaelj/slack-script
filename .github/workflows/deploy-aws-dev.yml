name: deploy aws dev

# Builds the Lambda container image and pushes it to ECR, then points the function at it.
# Terraform creates the function, and ignores the code, so the two never undo each other.
#
# While the function still runs a zip package, this keeps deploying the zip. It switches
# to the image by itself once Terraform has moved the function to a container image.
on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/build-lambda.sh"
      - "pyproject.toml"
      - "config/actions.yaml"
      - ".github/workflows/deploy-aws-dev.yml"
  # After tf apply, so a freshly created function gets the real code.
  workflow_run:
    workflows: ["tf apply"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

env:
  FUNCTION: anomaly-alerts
  REPOSITORY: anomaly-alerts
  AWS_REGION: us-east-1

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DEV only allows the dev branch. It signs in as dev-deployer.
    environment: DEV
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to aws
        id: login
        uses: ./.github/actions/cloud-login
        with:
          cloud: aws
          identity: dev-deployer
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

      # The repository comes from terraform/aws/seed.
      - name: Check the image repository exists
        id: repo
        if: steps.login.outputs.ready == 'true'
        run: |
          if uri=$(aws ecr describe-repositories --repository-names "$REPOSITORY" --query 'repositories[0].repositoryUri' --output text 2>/dev/null); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "uri=$uri" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Image push skipped: the ECR repository does not exist yet. Apply terraform/aws/seed first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The function is created by terraform/aws/dev. Its package type says which way to deploy.
      - name: Check DEV exists
        id: dev
        if: steps.login.outputs.ready == 'true'
        run: |
          if type=$(aws lambda get-function-configuration --function-name "$FUNCTION" --query PackageType --output text 2>/dev/null); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "package=$type" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Function update skipped: the DEV function does not exist yet. Apply terraform/aws/dev first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Lambda only accepts a plain image manifest, so provenance and SBOM attestations are off.
      - name: Build and push the image
        id: image
        if: steps.repo.outputs.ready == 'true'
        env:
          URI: ${{ steps.repo.outputs.uri }}
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "image=${URI}:${tag}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "${URI}:${tag} already exists"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${URI%%/*}"
          docker build --target lambda --build-arg EXTRAS=aws --provenance=false --sbom=false \
            -t "${URI}:${tag}" -t "${URI}:latest" .
          docker push "${URI}:${tag}"
          docker push "${URI}:latest"
          echo "Pushed \`${URI}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Point the function at the image
        if: steps.dev.outputs.package == 'Image' && steps.image.outputs.image != ''
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"
          echo "Deployed \`$IMAGE\` to \`$FUNCTION\`" >> "$GITHUB_STEP_SUMMARY"

      # The function still runs a zip, until Terraform moves it to the image.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.dev.outputs.package == 'Zip'
        with:
          python-version: "3.12"

      - name: Build the zip
        if: steps.dev.outputs.package == 'Zip'
        run: scripts/build-lambda.sh build/lambda.zip

      - name: Upload the zip
        if: steps.dev.outputs.package == 'Zip'
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://build/lambda.zip >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"
          version=$(aws lambda get-function --function-name "$FUNCTION" --query 'Configuration.CodeSha256' --output text)
          echo "Deployed \`$FUNCTION\` (code sha256 \`$version\`) from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
