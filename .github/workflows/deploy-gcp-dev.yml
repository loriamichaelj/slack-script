name: deploy gcp dev

# Builds the image and points the Cloud Run jobs at it. AWS and Azure get their own
# deploy-<cloud>-dev workflow when their dev roots exist.
on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "config/actions.yaml"
      - ".github/workflows/deploy-gcp-dev.yml"
  # After tf apply, so freshly created jobs get the real image.
  workflow_run:
    workflows: ["tf apply"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gcp-dev
  cancel-in-progress: false

env:
  GCP_PROJECT: slack-anomaly-dev
  REGION: us-central1
  JOBS: anomaly-run routine-heartbeat routine-digest routine-cost

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DEV only allows the dev branch. It signs in as dev-deployer.
    environment: DEV
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to gcp
        id: login
        uses: ./.github/actions/cloud-login
        with:
          cloud: gcp
          identity: dev-deployer
          gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_project: ${{ env.GCP_PROJECT }}

      # The jobs and the image repository come from terraform/gcp/dev.
      - name: Check DEV exists
        id: dev
        if: steps.login.outputs.ready == 'true'
        run: |
          if gcloud run jobs describe anomaly-run --region "$REGION" --project "$GCP_PROJECT" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: the DEV jobs do not exist yet. Apply terraform/gcp/dev first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: image
        if: steps.dev.outputs.ready == 'true'
        run: |
          image="${REGION}-docker.pkg.dev/${GCP_PROJECT}/anomaly-alerts/anomaly-alerts:${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if gcloud artifacts docker images describe "$image" >/dev/null 2>&1; then
            echo "$image already exists"
            exit 0
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target cli --build-arg EXTRAS=gcp -t "$image" .
          docker push "$image"

      - name: Point the jobs at the image
        if: steps.dev.outputs.ready == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          for job in $JOBS; do
            gcloud run jobs update "$job" --image "$IMAGE" --region "$REGION" --project "$GCP_PROJECT" --quiet
          done
          echo "Deployed \`$IMAGE\` to: $JOBS" >> "$GITHUB_STEP_SUMMARY"
