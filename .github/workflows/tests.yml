name: tests

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # CI requires a reviewer's approval before the job starts.
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
