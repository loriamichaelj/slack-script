name: security

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    # CI requires a reviewer's approval before the job starts.
    environment: CI
    steps:
      - uses: actions/checkout@v4

      - name: Trivy misconfiguration scan (Terraform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy dependency and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  checkov:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (Terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
