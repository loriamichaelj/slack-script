name: terraform plan

on:
  pull_request:
    branches: [dev]
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  GCP_PROJECT: slack-anomaly-dev

jobs:
  plan:
    runs-on: ubuntu-latest
    # CI requires a reviewer's approval before the job starts. It signs in as the
    # read-only tf-planner account.
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        # terraform/gcp/org is applied locally by an org admin; add dev once it exists.
        root: [seed]
    defaults:
      run:
        working-directory: terraform/gcp/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${GCP_PROJECT}-${{ matrix.root }}-tfstate"

      - name: Validate
        run: terraform validate -no-color

      # The planner cannot write to the state bucket, so the plan takes no lock.
      - name: Plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          {
            echo "### terraform plan: ${{ matrix.root }}"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
